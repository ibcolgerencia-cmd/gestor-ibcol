<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }
  // Actualización automática: si hay una versión publicada más nueva, borra la copia guardada y recarga
  (function revisarVersion() {
    if (location.protocol !== 'https:') return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.v || j.v === window.IBCOL_VERSION) return;
      var k = 'ibcol_recarga_' + j.v; try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) {}
      var tareas = [];
      if (navigator.serviceWorker) tareas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) tareas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (x) { return caches.delete(x); })); }));
      Promise.all(tareas).finally(function () { location.replace(location.pathname + '?v=' + j.v + location.hash); });
    }).catch(function () {});
    setTimeout(revisarVersion, 10 * 60 * 1000);
  })();
</script>
