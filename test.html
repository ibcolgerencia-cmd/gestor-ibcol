<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Pre y post test · IBCOL</title>
<meta name="theme-color" content="#0d3f52">
<link rel="icon" href="img/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #eef5f8; --card: #fff; --tx: #13303b; --mu: #5b7682; --ac: #0096be; --ac2: #0a7da0; --ln: #d6e4ea; --ok: #1e8e4e; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1d24; --card: #12303b; --tx: #e6f1f5; --mu: #9db6bf; --ln: #24485a; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Barlow, system-ui, sans-serif; background: var(--bg); color: var(--tx); font-size: 17px; line-height: 1.45; }
  header { background: linear-gradient(120deg, #0d3f52, #0096be); color: #fff; padding: 18px 16px 22px; }
  header .in, main { max-width: 760px; margin: 0 auto; }
  header .marca { display: flex; align-items: center; gap: 12px; }
  header img { height: 46px; width: 46px; object-fit: contain; background: #fff; border-radius: 50%; padding: 3px; }
  header h1 { font-size: 1.3rem; margin: 10px 0 2px; }
  header p { margin: 0; opacity: .9; font-size: .95rem; }
  main { padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--ln); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label.f { display: block; font-weight: 600; font-size: .9rem; margin: 10px 0 4px; }
  input[type=text], input[type=tel], select { width: 100%; padding: 11px 12px; border: 1px solid var(--ln); border-radius: 10px; font: inherit; background: var(--card); color: var(--tx); }
  .fases { display: flex; gap: 8px; flex-wrap: wrap; }
  .fases label { flex: 1; min-width: 140px; border: 2px solid var(--ln); border-radius: 12px; padding: 12px; cursor: pointer; font-weight: 600; text-align: center; }
  .fases input { display: none; }
  .fases label:has(input:checked) { border-color: var(--ac); background: rgba(0,150,190,.1); color: var(--ac2); }
  .q h3 { font-size: 1rem; margin: 0 0 8px; }
  .op { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border: 1px solid var(--ln); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
  .op input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--ac); }
  .op:has(input:checked) { border-color: var(--ac); background: rgba(0,150,190,.08); }
  .muted { color: var(--mu); font-size: .9rem; }
  canvas { width: 100%; height: 150px; border: 1px dashed var(--mu); border-radius: 10px; touch-action: none; background: #fff; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 13px 18px; cursor: pointer; }
  .pri { background: var(--ac); color: #fff; width: 100%; font-size: 1.05rem; }
  .pri:disabled { opacity: .6; }
  .sec { background: transparent; color: var(--ac2); border: 1px solid var(--ln); padding: 8px 12px; font-size: .9rem; }
  .err { color: var(--bad); font-weight: 600; }
  .res { text-align: center; }
  .res .n { font-size: 3rem; font-weight: 700; color: var(--ac2); }
  footer { text-align: center; color: var(--mu); font-size: .8rem; padding: 10px 16px 30px; }
</style>
</head>
<body>
<header><div class="in"><div class="marca"><img id="logo" src="img/logo.jpg" alt=""><div><b id="ent">Programa de tecnovigilancia</b><div style="font-size:.85rem;opacity:.85">Pre y post test de capacitación</div></div></div><h1 id="tema">Cargando…</h1><p id="sub"></p></div></header>
<main id="app"><div class="card">Cargando el test…</div></main>
<footer>IBCOL Ingeniería Biomédica de Colombia · Sus datos se usan solo para el registro de la capacitación de la entidad (Ley 1581 de 2012).</footer>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')</script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = $('#app');
  const msg = (t, cls = '') => { app.innerHTML = `<div class="card ${cls}">${t}</div>`; };
  const token = new URLSearchParams(location.search).get('t') || '';
  const C = window.IBCOL_CONFIG || {};
  if (!token || !C.SUPABASE_URL || !window.supabase) { $('#tema').textContent = 'Enlace no válido'; msg('Este enlace no es válido. Pida al capacitador un enlace nuevo.', 'err'); return; }
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  const fFecha = (s) => (s ? new Date(s + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }) : '');

  // firma en pantalla
  const pad = (cv) => {
    const ctx = cv.getContext('2d'); let dib = false, usado = false;
    const ajustar = () => { const r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = r.height * 2; ctx.scale(2, 2); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0d2a35'; };
    ajustar();
    const p = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', (e) => { dib = true; usado = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...p(e)); });
    cv.addEventListener('pointermove', (e) => { if (dib) { ctx.lineTo(...p(e)); ctx.stroke(); } });
    cv.addEventListener('pointerup', () => { dib = false; });
    return { limpiar: () => { ctx.clearRect(0, 0, cv.width, cv.height); usado = false; }, dato: () => {
      if (!usado) return null; const o = document.createElement('canvas'); o.width = 500; o.height = Math.round(500 * cv.height / cv.width); const c2 = o.getContext('2d'); c2.drawImage(cv, 0, 0, o.width, o.height); return o.toDataURL('image/png'); } };
  };

  (async () => {
    const { data: info, error } = await sb.rpc('tv_test_info', { p_token: token });
    if (error || !info) { $('#tema').textContent = 'Enlace no válido'; msg('Este enlace no es válido o fue cambiado. Pida al capacitador el enlace vigente.', 'err'); return; }
    if (info.logo && /^data:image\//.test(info.logo)) $('#logo').src = info.logo;
    $('#ent').textContent = info.entidad || 'Programa de tecnovigilancia';
    $('#tema').textContent = info.tema || 'Capacitación';
    $('#sub').textContent = [fFecha(info.fecha), info.capacitador].filter(Boolean).join(' · ');
    document.title = `Test · ${info.tema || ''}`;
    if (!info.abierto || !(info.fases || []).length) { msg('Este test está cerrado en este momento. Cuando el capacitador lo habilite, vuelva a abrir este mismo enlace.'); return; }
    const fases = info.fases; const preg = info.preguntas || [];
    app.innerHTML = `<form id="fm" class="" novalidate>
      <div class="card"><b>¿Qué test va a responder?</b><div class="fases" style="margin-top:8px">
        ${fases.includes('pre') ? `<label><input type="radio" name="fase" value="pre" ${fases.length === 1 || fases[0] === 'pre' ? 'checked' : ''}>PRE-TEST<br><span class="muted">antes de la capacitación</span></label>` : ''}
        ${fases.includes('post') ? `<label><input type="radio" name="fase" value="post" ${fases.length === 1 && fases[0] === 'post' ? 'checked' : ''}>POST-TEST<br><span class="muted">después de la capacitación</span></label>` : ''}</div></div>
      <div class="card"><b>Sus datos</b>
        <label class="f" for="nombre">Nombres y apellidos *</label><input type="text" id="nombre" autocomplete="name" maxlength="120" required>
        <label class="f" for="cedula">Número de cédula *</label><input type="tel" id="cedula" inputmode="numeric" maxlength="20" required>
        <label class="f" for="servicio">Servicio o área</label><input type="text" id="servicio" maxlength="80">
        <label class="f" for="cargo">Cargo</label><input type="text" id="cargo" maxlength="80"></div>
      <p class="muted" style="margin:0 4px 10px"><b>Marque la o las respuestas correctas.</b></p>
      ${preg.map((q, i) => `<div class="card q"><h3>${i + 1}. ${h(q.p)}</h3>${(q.o || []).map((o, j) => `<label class="op"><input type="checkbox" name="q${i}" value="${j}"><span>${'abcdefg'[j]}) ${h(o)}</span></label>`).join('')}</div>`).join('')}
      ${info.firma ? `<div class="card"><b>Firma</b> <span class="muted">(para la lista de asistencia)</span><canvas id="cv" aria-label="Espacio para firmar"></canvas><div style="margin-top:6px"><button type="button" class="sec" id="limpiar">Borrar firma</button></div></div>` : ''}
      <p id="err" class="err" role="alert"></p>
      <button class="pri" id="enviar" type="submit">Enviar respuestas</button></form>`;
    const firma = info.firma ? pad($('#cv')) : null;
    if (firma) $('#limpiar').onclick = firma.limpiar;
    $('#fm').addEventListener('submit', async (e) => {
      e.preventDefault(); const err = $('#err'); err.textContent = '';
      const fase = (document.querySelector('[name=fase]:checked') || {}).value;
      const nombre = $('#nombre').value.trim(), cedula = $('#cedula').value.trim();
      if (!fase) { err.textContent = 'Elija si es el pre-test o el post-test.'; return; }
      if (nombre.length < 3 || cedula.replace(/\D/g, '').length < 4) { err.textContent = 'Escriba su nombre completo y su número de cédula.'; return; }
      const resp = preg.map((q, i) => [...document.querySelectorAll(`[name=q${i}]:checked`)].map((x) => +x.value));
      const sinR = resp.findIndex((r) => !r.length);
      if (sinR >= 0 && !confirm(`La pregunta ${sinR + 1} no tiene respuesta. ¿Enviar de todas formas?`)) return;
      const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando…';
      const { data, error } = await sb.rpc('tv_test_responder', { p_token: token, p_fase: fase, p_nombre: nombre, p_cedula: cedula, p_servicio: $('#servicio').value.trim(), p_cargo: $('#cargo').value.trim(), p_resp: resp, p_firma: firma ? firma.dato() : null });
      if (error) { err.textContent = (error.message || 'No se pudo enviar. Intente de nuevo.').replace(/^.*?:\s(?=[A-ZÁÉÍÓÚ])/, ''); b.disabled = false; b.textContent = 'Enviar respuestas'; return; }
      window.scrollTo(0, 0);
      app.innerHTML = `<div class="card res"><p style="font-size:1.2rem;margin:4px 0"><b>¡Gracias, ${h(nombre.split(' ')[0])}!</b></p><p>Su ${fase === 'pre' ? 'pre-test' : 'post-test'} quedó registrado.</p>
        ${data?.mostrar ? `<div class="n">${data.puntaje}%</div><p class="muted">${data.correctas} de ${data.total} respuestas correctas</p>` : ''}
        ${fase === 'pre' ? '<p class="muted">Al terminar la capacitación abra de nuevo este enlace para responder el post-test.</p>' : ''}</div>`;
    });
  })();
})();
</script>
</body>
</html>
